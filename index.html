<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050a12" />
    <meta name="description" content="Breakout3D – ein räumliches Breakout-Spiel mit Three.js" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/breakout3d/manifest.webmanifest" />
    <link rel="icon" href="/breakout3d/icon.svg" type="image/svg+xml" />
    <title>Breakout3D</title>
  </head>
  <body>
    <main>
      <div class="hud">
        <div class="hud-brand">
          <h1>BREAKOUT<span>3D</span></h1>
          <p id="status">Vertical Slice</p>
        </div>
        <div class="hud-actions">
          <button id="inspect" type="button" aria-pressed="false">Inspect</button>
          <button id="settings-open" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
        </div>
      </div>
      <div id="game" aria-label="3D-Breakout-Spielfeld"></div>

      <section id="settings-panel" class="settings-panel" hidden aria-label="Einstellungen">
        <div class="settings-sheet">
          <div class="settings-header">
            <div>
              <p class="settings-kicker">BREAKOUT3D</p>
              <h2>Einstellungen</h2>
            </div>
            <button id="settings-close" class="settings-close" type="button" aria-label="Einstellungen schließen">×</button>
          </div>

          <div class="settings-group">
            <p class="settings-label">Level</p>
            <div id="level-select" class="level-select" role="group" aria-label="Level auswählen"></div>
          </div>

          <div class="settings-row">
            <div>
              <strong>Musik &amp; Sound</strong>
              <span>Adaptive Musik und Treffer-SFX</span>
            </div>
            <button id="settings-audio" class="settings-toggle" type="button" aria-pressed="true">An</button>
          </div>

          <div class="settings-row">
            <div>
              <strong>Haptik</strong>
              <span id="haptics-note">Vibration bei Treffern und Perfect Flips</span>
            </div>
            <button id="settings-haptics" class="settings-toggle" type="button" aria-pressed="true">An</button>
          </div>
        </div>
      </section>

      <section id="results" class="results-card" hidden aria-live="polite">
        <p id="result-kicker" class="result-kicker">REACTOR GARDEN</p>
        <h2 id="result-title">Complete</h2>
        <div id="result-stars" class="result-stars" aria-label="Sterne"></div>
        <p id="result-details"></p>
        <button id="retry" type="button">Nochmal spielen</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
