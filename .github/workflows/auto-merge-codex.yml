name: Auto-merge Codex pull requests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  squash:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'codex/') &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Squash and merge matching pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(gh pr list --repo "$REPOSITORY" --state open --search "$HEAD_SHA" --json number --jq '.[0].number')"
          test -n "$pr_number"
          gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch

      - name: Deploy merged main to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$REPOSITORY" --ref main
